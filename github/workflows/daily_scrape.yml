name: Automated Daily Threat Intel Scraper

on:
  schedule:
    # Berjalan secara automatik setiap hari pada jam 16:00 UTC (Bersamaan jam 12:00 Malam Waktu Malaysia)
    - cron: '0 16 * * *'
  workflow_dispatch: # Membolehkan anda klik 'Run' secara manual di GitHub jika mahu test bila-bila masa

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: Ambil Kod Repositori
      uses: actions/checkout@v3

    - name: Sediakan Persekitaran Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Pasang Pustaka Dependensi
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 google-generativeai supabase

    - name: Jalankan Ejen Scraper Ke Supabase
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python scraper.py
